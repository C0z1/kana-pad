name: release
# Builds the downloadable apps. A tag vX.Y.Z publishes them to GitHub Releases;
# a manual run (workflow_dispatch) only builds them as downloadable workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Same command as the "tauri" npm script, which the Android Gradle build calls back into.
  TAURI_CLI: npm run tauri --

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential
      - run: npm test
      - name: Rust tests
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: ${{ env.TAURI_CLI }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Kana Pad ${{ github.ref_name }}
          releaseBody: |
            Descargas:
            - **Windows:** el instalador `.msi` o `-setup.exe`. Windows SmartScreen puede avisar porque el instalador no está firmado: "Más información" → "Ejecutar de todas formas".
            - **Linux:** `.AppImage` (dale permiso de ejecución) o `.deb`.
            - **Android:** `kana-pad-android.apk` (permite instalar apps de origen desconocido).
            - **Sin instalar nada:** https://c0z1.github.io/kana-pad/
          releaseDraft: false
          prerelease: false
      - uses: actions/upload-artifact@v4
        with:
          name: kana-pad-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image already ships the Android SDK and NDK.
      - name: Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: ${{ env.TAURI_CLI }} android init --ci
      # shortcut: debug-signed APK (installable, not for Play Store); switch to a release keystore in secrets before publishing to a store.
      # Most phones are arm64; one ABI keeps the APK small.
      # With the release keystore in secrets (see tools/android-keystore.ps1) the APK is a signed
      # release that installs over the previous one; without it, a debug build as before.
      - name: Build APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            ${{ env.TAURI_CLI }} android build --apk --target aarch64
            unsigned="$(find src-tauri/gen/android -name '*release-unsigned.apk' | head -1)"
            echo "$KS_B64" | base64 -d > release.jks
            bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            "$bt/zipalign" -f 4 "$unsigned" aligned.apk
            "$bt/apksigner" sign --ks release.jks --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --out kana-pad-android.apk aligned.apk
            rm -f release.jks
          else
            ${{ env.TAURI_CLI }} android build --apk --debug --target aarch64
            cp "$(find src-tauri/gen/android -name '*debug*.apk' | head -1)" kana-pad-android.apk
          fi
          ls -lh kana-pad-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kana-pad-android
          path: kana-pad-android.apk
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: kana-pad-android.apk
          overwrite_files: true
