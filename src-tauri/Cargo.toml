[package]
name = "kana-pad"
version = "0.6.0"
description = "Práctica de japonés con mando Xbox"
edition = "2021"
license = "MIT"

[lib]
name = "kana_pad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# The Android test build uses the dev profile: without debug info the APK goes from
# hundreds of MB to a few dozen.
[profile.dev]
debug = false
strip = "debuginfo"
